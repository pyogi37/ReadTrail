<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadTrail Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="options-container">
    <header class="header">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3" stroke="#FF6B6B" stroke-width="2"/>
        <line x1="7" y1="8" x2="17" y2="8" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
        <line x1="7" y1="12" x2="14" y2="12" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <line x1="7" y1="16" x2="17" y2="16" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      </svg>
      <div>
        <h1>ReadTrail</h1>
        <p class="subtitle">Reading marker appearance</p>
      </div>
    </header>

    <section class="section" aria-labelledby="trail-style-heading">
      <h2 id="trail-style-heading">Trail Style</h2>
      <div class="style-picker" id="stylePicker" role="group" aria-label="Trail style">
        <button type="button" class="style-btn active" data-style="ruler" aria-pressed="true">
          <span class="style-preview ruler-preview" aria-hidden="true"></span>
          <span>Ruler</span>
        </button>
        <button type="button" class="style-btn" data-style="dots" aria-pressed="false">
          <span class="style-preview dots-preview" aria-hidden="true"></span>
          <span>Dots</span>
        </button>
        <button type="button" class="style-btn" data-style="underline" aria-pressed="false">
          <span class="style-preview underline-preview" aria-hidden="true"></span>
          <span>Underline</span>
        </button>
      </div>
    </section>

    <section class="section" aria-labelledby="appearance-heading">
      <h2 id="appearance-heading">Appearance</h2>
      <div class="control">
        <label for="color">Trail Color</label>
        <input type="color" id="color" value="#FF6B6B">
      </div>
      <div class="control">
        <label for="size">Size <output id="sizeValue" for="size">30</output>px</label>
        <input type="range" id="size" min="10" max="100" value="30" aria-valuetext="30 pixels">
      </div>
      <div class="control">
        <label for="opacity">Opacity <output id="opacityValue" for="opacity">30</output>%</label>
        <input type="range" id="opacity" min="10" max="100" value="30" aria-valuetext="30 percent">
      </div>
    </section>

    <section class="section dots-options" id="dotsOptions" aria-labelledby="dots-heading" hidden>
      <h2 id="dots-heading">Dots Settings</h2>
      <div class="control">
        <label for="dotCount">Dot Count <output id="dotCountValue" for="dotCount">20</output></label>
        <input type="range" id="dotCount" min="5" max="50" value="20" aria-valuetext="20 dots">
      </div>
      <div class="control">
        <label for="fadeSpeed">Fade retention <output id="fadeSpeedValue" for="fadeSpeed">90</output>%</label>
        <input type="range" id="fadeSpeed" min="80" max="99" value="90" aria-valuetext="90 percent">
      </div>
    </section>

    <section class="section" aria-labelledby="highlight-heading">
      <h2 id="highlight-heading">Text Highlighting</h2>
      <div class="control checkbox-row">
        <label for="highlightLine">Highlight current line</label>
        <input type="checkbox" id="highlightLine">
      </div>
      <div class="control highlight-options" id="highlightOptions" hidden>
        <label for="highlightColor">Highlight Color</label>
        <input type="color" id="highlightColor" value="#FFEB3B">
      </div>
    </section>

    <footer class="footer">
      <button type="button" id="resetBtn" class="btn-reset">Reset to defaults</button>
      <p id="saveStatus" class="save-status" role="status" aria-live="polite"></p>
    </footer>
  </main>
  <script src="options.js"></script>
</body>
</html>

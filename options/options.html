<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ReadTrail Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <div class="header">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="3" stroke="#FF6B6B" stroke-width="2"/>
        <line x1="7" y1="8" x2="17" y2="8" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
        <line x1="7" y1="12" x2="14" y2="12" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
        <line x1="7" y1="16" x2="17" y2="16" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      </svg>
      <div>
        <h1>ReadTrail</h1>
        <p class="subtitle">Reading cursor trail settings</p>
      </div>
    </div>

    <div class="section">
      <h2>Trail Style</h2>
      <div class="style-picker" id="stylePicker">
        <button class="style-btn active" data-style="ruler">
          <div class="style-preview ruler-preview"></div>
          <span>Ruler</span>
        </button>
        <button class="style-btn" data-style="dots">
          <div class="style-preview dots-preview"></div>
          <span>Dots</span>
        </button>
        <button class="style-btn" data-style="underline">
          <div class="style-preview underline-preview"></div>
          <span>Underline</span>
        </button>
      </div>
    </div>

    <div class="section">
      <h2>Appearance</h2>
      <div class="control">
        <label>Trail Color</label>
        <input type="color" id="color" value="#FF6B6B">
      </div>
      <div class="control">
        <label>Size <span id="sizeValue">30</span>px</label>
        <input type="range" id="size" min="10" max="100" value="30">
      </div>
      <div class="control">
        <label>Opacity <span id="opacityValue">30</span>%</label>
        <input type="range" id="opacity" min="10" max="100" value="30">
      </div>
    </div>

    <div class="section dots-options" id="dotsOptions">
      <h2>Dots Settings</h2>
      <div class="control">
        <label>Dot Count <span id="dotCountValue">20</span></label>
        <input type="range" id="dotCount" min="5" max="50" value="20">
      </div>
      <div class="control">
        <label>Fade Speed <span id="fadeSpeedValue">0.90</span></label>
        <input type="range" id="fadeSpeed" min="80" max="99" value="90">
      </div>
    </div>

    <div class="section">
      <h2>Text Highlighting</h2>
      <div class="control checkbox-row">
        <label>Highlight current line</label>
        <input type="checkbox" id="highlightLine">
      </div>
      <div class="control highlight-options" id="highlightOptions">
        <label>Highlight Color</label>
        <input type="color" id="highlightColor" value="#FFEB3B">
      </div>
    </div>

    <div class="section">
      <h2>General</h2>
      <div class="control checkbox-row">
        <label>Enable ReadTrail</label>
        <input type="checkbox" id="enabled" checked>
      </div>
    </div>

    <div class="footer">
      <button id="resetBtn" class="btn-reset">Reset to Defaults</button>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>

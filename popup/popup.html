<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadTrail</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="#FF6B6B" stroke-width="2"/>
          <line x1="7" y1="8" x2="17" y2="8" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
          <line x1="7" y1="12" x2="14" y2="12" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
          <line x1="7" y1="16" x2="17" y2="16" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
        </svg>
        <h1 class="title">ReadTrail</h1>
      </div>
    </header>

    <div class="activation" id="activation" aria-live="polite">
      <div class="status-row">
        <span class="status" id="statusLabel">Loading…</span>
        <label class="toggle" id="toggleLabel">
          <input type="checkbox" id="toggleSwitch" aria-label="Use ReadTrail on this page" disabled>
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>
      <p class="description" id="description"></p>
      <div class="reading-lock-notice" id="readingLockNotice" role="note" hidden>
        <strong>Reading lock</strong>
        <span>While active, ReadTrail reserves primary clicks for pausing or resuming. Turn it off before using page links or controls.</span>
      </div>
    </div>

    <section class="save-section" id="saveSection" aria-label="Save reading position" hidden>
      <p class="save-description" id="saveHint"></p>
      <button type="button" id="saveButton" class="save-button" disabled>Save for later</button>
      <p class="saved-status" id="saveStatus" role="status" hidden></p>
      <p class="local-note" id="localNote">The exact page URL and title are saved on this device.</p>
    </section>

    <section class="reading-space-section" aria-labelledby="readingSpaceButton">
      <button type="button" id="readingSpaceButton" class="reading-space-button">
        <span class="reading-space-label">Reading Space</span>
        <span class="reading-space-coming">Saved pages</span>
      </button>
    </section>

    <p class="error" id="error" role="alert" hidden></p>

    <footer class="footer">
      <button type="button" id="openOptions" class="settings-button">Open settings</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadTrail</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="#FF6B6B" stroke-width="2"/>
          <line x1="7" y1="8" x2="17" y2="8" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
          <line x1="7" y1="12" x2="14" y2="12" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
          <line x1="7" y1="16" x2="17" y2="16" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
        </svg>
        <h1 class="title">ReadTrail</h1>
      </div>
    </header>
    <div class="toggle-row">
      <span class="toggle-label" id="statusLabel" aria-live="polite">Enabled</span>
      <label class="toggle" aria-label="Enable ReadTrail">
        <input type="checkbox" id="toggleSwitch" checked>
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
    <footer class="footer">
      <button type="button" id="openOptions" class="settings-button">Open settings</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
